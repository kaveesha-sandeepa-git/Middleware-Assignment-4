<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SwiftLogistics Client Portal</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 0; background:#f6f7fb; color:#111; }
        .nav { background: #fff; border-bottom: 1px solid #e7e7ef; padding: 12px 16px; display:flex; gap: 12px; align-items:center; }
        .brand { font-weight: 700; }
        .spacer { flex: 1; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
        .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .card { background:#fff; border: 1px solid #e7e7ef; border-radius: 12px; padding: 14px; }
        .muted { color:#666; font-size: 0.92rem; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; background: #111; color: #fff; cursor: pointer; }
        button.secondary { background:#fff; color:#111; }
        input, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin: 6px 0 12px; }
        .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; }
        .list { display:flex; flex-direction:column; gap: 10px; }
        .order-card { border: 1px solid #eee; border-radius: 12px; padding: 12px; background: #fff; cursor:pointer; }
        .order-card:hover { border-color: #d9d9ff; }
        .order-header { display:flex; justify-content:space-between; align-items:center; gap: 10px; }
        .status-badge { padding: 6px 10px; border-radius: 999px; border: 1px solid #ddd; font-size: 0.8rem; background:#f1f2f6; }
        .status-pending { background:#fff7e6; border-color:#ffe3a3; }
        .status-in_transit { background:#e7f0ff; border-color:#b8d2ff; }
        .status-out_for_delivery { background:#e6fffb; border-color:#a7f3ea; }
        .status-delivered { background:#e6ffef; border-color:#a9f5c2; }
        .status-failed { background:#ffe8ea; border-color:#ffb8c0; }
        .tabs { display:flex; gap: 10px; margin: 12px 0; }
        .tabBtn { padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; background:#fff; cursor:pointer; }
        .tabBtn.active { border-color:#111; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .toast { position: fixed; right: 16px; bottom: 16px; background:#111; color:#fff; padding: 10px 12px; border-radius: 10px; opacity: 0; transform: translateY(10px); transition: all 0.2s ease; max-width: 320px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background:#b00020; }
        .toast.success { background:#0b6b2c; }
        .toast.info { background:#0b3d91; }

        /* modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display:none; align-items:center; justify-content:center; padding:16px; }
        .modal.active { display:flex; }
        .modalInner { width: min(720px, 96vw); background:#fff; border-radius: 12px; padding: 16px; border:1px solid #e7e7ef; }
        .modalHeader { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .x { background:#fff; color:#111; }
        .empty-state { color:#666; padding: 12px; }
    </style>
</head>
<body>
<div class="nav">
    <div class="brand">SwiftLogistics Client Portal</div>
    <div class="spacer"></div>
    <div id="auth-state" class="muted"></div>
    <button id="logout-btn" class="secondary" style="display:none;">Logout</button>
</div>

<div class="container">
    <!-- Login -->
    <!-- Login -->
    <div id="login-card" class="card">
        <h2 style="margin-top:0;">Sign In</h2>
        <form id="login-form">
            <label>Name</label>
            <input id="login-name" type="text" placeholder="Your name" required />

            <label>Email</label>
            <input id="login-email" type="email" placeholder="client@email.com" required />

            <button type="submit">Sign In</button>

            <div class="muted" style="margin-top:10px;">
                Backend must implement <span class="mono">POST /api/auth/login</span> and accept
                <span class="mono">{ "name": "...", "email": "..." }</span>.
            </div>
        </form>
    </div>

    <!-- App -->
    <div id="app" style="display:none;">
        <div class="tabs">
            <button class="tabBtn active" onclick="showClientTab('dashboard')">Dashboard</button>
            <button class="tabBtn" onclick="showClientTab('track-orders')">Track Orders</button>
            <button class="tabBtn" onclick="showClientTab('submit-order')">Submit Order</button>
        </div>

        <div id="client-dashboard" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <div class="muted">Total Orders</div>
                    <div style="font-size:28px;font-weight:700" id="total-orders">0</div>
                </div>
                <div class="card">
                    <div class="muted">Active Deliveries</div>
                    <div style="font-size:28px;font-weight:700" id="active-deliveries">0</div>
                </div>
                <div class="card">
                    <div class="muted">Completed</div>
                    <div style="font-size:28px;font-weight:700" id="completed-deliveries">0</div>
                </div>
                <div class="card">
                    <div class="muted">Pending</div>
                    <div style="font-size:28px;font-weight:700" id="pending-orders">0</div>
                </div>
            </div>

            <div class="row" style="margin-top:12px;">
                <h3 style="margin:0;">Recent Orders</h3>
                <div>
                    <button class="secondary" onclick="loadClientDashboard()">Refresh</button>
                </div>
            </div>
            <div id="recent-orders-list" class="list" style="margin-top:10px;"></div>
        </div>

        <div id="client-track-orders" class="tab-content">
            <div class="row">
                <h3 style="margin:0;">All Orders</h3>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input id="order-search" placeholder="Search by Order ID or customer name" style="width:320px; margin:0;" oninput="searchOrders()" />
                    <button class="secondary" onclick="loadClientDashboard()">Refresh</button>
                </div>
            </div>
            <div id="orders-list" class="list" style="margin-top:10px;"></div>
        </div>

        <div id="client-submit-order" class="tab-content">
            <div class="card">
                <h3 style="margin-top:0;">Submit Order</h3>
                <form id="submit-order-form">
                    <div class="row">
                        <div style="flex:1;">
                            <label>Customer Name</label>
                            <input id="customer-name" required />
                        </div>
                        <div style="flex:1;">
                            <label>Customer Email</label>
                            <input id="customer-email" type="email" required />
                        </div>
                    </div>

                    <label>Delivery Street</label>
                    <input id="delivery-street" required />
                    <div class="row">
                        <div style="flex:1;">
                            <label>City</label>
                            <input id="delivery-city" required />
                        </div>
                        <div style="flex:1;">
                            <label>State</label>
                            <input id="delivery-state" required />
                        </div>
                        <div style="flex:1;">
                            <label>Zip</label>
                            <input id="delivery-zip" required />
                        </div>
                    </div>

                    <div class="row">
                        <div style="flex:1;">
                            <label>Package Weight (kg)</label>
                            <input id="package-weight" type="number" step="0.01" required />
                        </div>
                        <div style="flex:2;">
                            <label>Description</label>
                            <input id="package-description" required />
                        </div>
                        <div style="flex:1;">
                            <label>Priority</label>
                            <select id="order-priority">
                                <option value="normal">normal</option>
                                <option value="high">high</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit">Submit</button>
                    <div class="muted" style="margin-top:10px;">
                        Backend must implement <span class="mono">POST /api/orders</span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Order detail modal -->
<div id="order-detail-modal" class="modal" onclick="if(event.target.id==='order-detail-modal'){ this.classList.remove('active'); }">
    <div class="modalInner">
        <div class="modalHeader">
            <div class="brand">Order Detail</div>
            <button class="x" onclick="document.getElementById('order-detail-modal').classList.remove('active')">Close</button>
        </div>
        <div id="order-detail-content" style="margin-top:10px;"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<!-- scripts -->
<script type="module" src="./js/apiClient.js"></script>
<script type="module" src="./js/auth.js"></script>
<script type="module" src="./js/wsService.js"></script>
<script type="module" src="./js/clientPortal.js"></script>
</body>
</html>

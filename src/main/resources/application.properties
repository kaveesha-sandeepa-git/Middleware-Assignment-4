server.port=4000

# --- Postgres ---
spring.datasource.url=jdbc:postgresql://localhost:5432/SwiftLogistics
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.assignment_4.SwiftLogistics.*

# Topics
cms.kafka.topic.order-created=order-created
cms.kafka.topic.order-validated=order-validated
cms.kafka.topic.order-validation-failed=order-validation-failed
spring.kafka.consumer.group-id=cms-service


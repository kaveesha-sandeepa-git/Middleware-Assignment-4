server:
  port: 8082   # Optional REST port (for actuator/testing)

spring:
  application:
    name: wms-service

  datasource:
    url: jdbc:h2:mem:wmsdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    root: INFO
    com.swiftlogistics.wms: DEBUG

wms:
  tcp:
    port: 9090
  rabbitmq:
    exchange: wms.exchange
    queue: wms.status.queue
    routing-key: wms.status